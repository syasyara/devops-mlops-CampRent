<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampRent - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                <h1>CampRent</h1>
                <p>Camping & Outdoor Reservation</p>
            </div>

            <!-- LOGIN -->
            <div id="loginForm">

                <h2>Login</h2>

                <p class="form-description">
                    Silakan masuk ke akun CampRent Anda.
                </p>

                <form onsubmit="login(event)">

                    <div class="form-group">
                        <label>Email</label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Masukkan email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Password</label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Masukkan password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn-primary">
                        Login
                    </button>

                </form>

                <p class="switch-form">
                    Belum punya akun?
                    <button onclick="showRegister()">
                        Daftar
                    </button>
                </p>

            </div>


            <!-- REGISTER -->
            <div id="registerForm" style="display: none;">

                <h2>Daftar Akun</h2>

                <p class="form-description">
                    Buat akun untuk melakukan reservasi camping.
                </p>

                <form onsubmit="register(event)">

                    <div class="form-group">

                        <label>Nama Lengkap</label>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Masukkan nama lengkap"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Masukkan email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Password</label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Minimal 6 karakter"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Nomor WhatsApp</label>

                        <input
                            type="tel"
                            id="registerPhone"
                            placeholder="08xxxxxxxxxx"
                            required
                        >

                    </div>


                    <button type="submit" class="btn-primary">
                        Daftar
                    </button>

                </form>


                <p class="switch-form">

                    Sudah punya akun?

                    <button onclick="showLogin()">
                        Login
                    </button>

                </p>

            </div>

        </div>

    </div>


    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
