<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampRent - Booking</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/user.css"
    >

</head>


<body>


<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar">

    <div class="navbar-logo">

        <h2>CampRent</h2>

    </div>


    <div class="navbar-menu">

        <a href="index.html">
            Home
        </a>

        <a href="booking.html"
           class="active">
            Booking
        </a>

        <a href="history.html">
            Riwayat
        </a>

        <button
            onclick="logout()"
            class="btn-logout"
        >
            Logout
        </button>

    </div>

</nav>



<!-- ==========================================
     MAIN
========================================== -->

<main class="user-container">


    <section class="booking-page">

        <h1>
            Form Booking
        </h1>

        <p>
            Lengkapi data berikut untuk
            melakukan reservasi camping.
        </p>


        <form
            id="bookingForm"
            onsubmit="submitBooking(event)"
        >


            <!-- PAKET -->

            <div class="form-group">

                <label>
                    Paket Camping
                </label>

                <select
                    id="packageSelect"
                    required
                >

                    <option value="">
                        Pilih paket
                    </option>

                </select>

            </div>



            <!-- TANGGAL -->

            <div class="form-group">

                <label>
                    Tanggal Camping
                </label>

                <input
                    type="date"
                    id="bookingDate"
                    required
                >

            </div>



            <!-- DURASI -->

            <div class="form-group">

                <label>
                    Durasi Camping
                </label>

                <input
                    type="number"
                    id="duration"
                    min="1"
                    value="1"
                    required
                >

                <small>
                    Jumlah malam
                </small>

            </div>



            <!-- BBQ -->

            <div class="form-group">

                <label>
                    Pilihan BBQ
                </label>

                <select
                    id="bbqSelect"
                >

                    <option value="0">
                        Tidak menggunakan BBQ
                    </option>

                </select>

            </div>



            <!-- CATATAN -->

            <div class="form-group">

                <label>
                    Catatan
                </label>

                <textarea
                    id="notes"
                    rows="4"
                    placeholder="Catatan tambahan..."
                ></textarea>

            </div>



            <!-- TOTAL -->

            <div class="booking-summary">

                <h3>
                    Ringkasan Booking
                </h3>


                <div class="summary-row">

                    <span>
                        Harga Camping
                    </span>

                    <strong id="campPrice">
                        Rp0
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Harga BBQ
                    </span>

                    <strong id="bbqPrice">
                        Rp0
                    </strong>

                </div>


                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <strong id="totalPrice">
                        Rp0
                    </strong>

                </div>

            </div>



            <button
                type="submit"
                class="btn-primary"
            >

                Konfirmasi Booking

            </button>


        </form>

    </section>

</main>



<script src="../js/data.js"></script>

<script src="../js/booking.js"></script>


</body>

</html>
